name: Release UPII

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # must satisfy requires-python (>=3.10,<3.13)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (Mac)
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          scripts\build.bat

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upii-${{ runner.os }}
          path: dist/upii*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # The repo default for GITHUB_TOKEN is read-only, so creating a release 403s.
    # Grant write scope here rather than repo-wide, to keep every other job read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            upii-macOS/upii
            upii-Windows/upii.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
