name: Publish to PyPI

# Publishes on version tags (v0.5.1, v1.0.0, ...).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in GitHub.
# One-time setup: PyPI -> Manage project 'upii' -> Publishing -> add GitHub
# publisher (owner/repo, workflow: pypi-publish.yml, environment: pypi).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          upii --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
