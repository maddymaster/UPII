name: Publish to PyPI

# Publishes on version tags (v0.7.0, v1.0.0, ...).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in GitHub.
#
# One-time setup (FIRST release — the project does not exist on PyPI yet, so use a
# "pending publisher", not "Manage project"):
#   PyPI -> account -> Publishing -> Add a pending publisher, with EXACTLY:
#     PyPI Project Name: upii
#     Owner:             maddymaster
#     Repository name:   UPII
#     Workflow name:     pypi-publish.yml
#     Environment name:  pypi        <- must match `environment: pypi` below
# After the first successful publish it becomes a normal publisher under the project.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          upii --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
