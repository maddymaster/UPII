    <rect x="9" y="9" width="26" height="26" rx="8" fill="none" stroke="#F5F3EE" stroke-width="2" opacity="0.55"/>
    <rect x="14.5" y="14.5" width="15" height="15" rx="5" fill="none" stroke="#F5F3EE" stroke-width="2" opacity="0.8"/>
    <circle cx="22" cy="22" r="3.4" fill="#E8632C"/>
  </g>
  <text x="54" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="600" letter-spacing="0.2" fill="#1C1B4B">smritium</text>
</svg>
